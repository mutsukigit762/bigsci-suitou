<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出納">
<title>ビッグサイエンス出納</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 図書館の請求票みたいな一枚もの：上に進み具合、下に回ごとの票 */
:root{
  --bg:#eef1f3; --card:#ffffff; --ink:#1f2a33; --sub:#5d6b77; --line:#d5dbe0;
  --accent:#2f6d8f; --done:#2f6fd0; --donebg:#e3edfb; --past:#8a96a0;
  color-scheme:light;
  --f:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
h1{font-size:20px;margin:4px 0 2px;text-wrap:balance}
.meta{color:var(--sub);font-size:12.5px;margin:0 0 14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 10px;z-index:2;display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5em;text-align:right}
.status{font-size:12px;color:var(--sub);margin:0 0 10px;min-height:1em}
.grp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.gh span{font-weight:400;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:first-of-type{border-top:0}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.box{flex:none;width:26px;height:26px;border:2px solid var(--sub);border-radius:6px;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff}
.row.on{background:var(--donebg)}
.row.on .box{background:var(--done);border-color:var(--done)}

.row.past .box{border-style:dashed;border-color:var(--past);color:var(--past);font-size:11px;width:auto;min-width:26px;padding:0 3px}
.no{flex:none;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--sub);width:6.6em}
.ti{min-width:0;flex:1;overflow-wrap:anywhere}
.row.on .ti{color:var(--sub)}
.star{color:#d33a3a;font-weight:700}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ビッグサイエンス出納</h1>
  <p class="meta">国際子ども図書館・請求記号 Z32-48・一度に5冊まで</p>
  <div class="bar"><div class="prog"><i id="pg"></i></div><div class="count" id="ct">0 / 28</div></div>
  <p class="status" id="st">記録を読み込み中…</p>
  <div id="list"></div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, deleteField, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// todoアプリと同じ Firebase プロジェクト。ルールは「ムツキ本人だけ」。
const app = initializeApp({
  apiKey: "AIzaSyCKaQiKqGgb658Vafc8SLHfzu5KanjXaNw",
  authDomain: "todo-mutsuki-ea166.firebaseapp.com",
  projectId: "todo-mutsuki-ea166",
  storageBucket: "todo-mutsuki-ea166.firebasestorage.app",
  messagingSenderId: "511470199591",
  appId: "1:511470199591:web:b4782f2069a823d552bf02"
});
const auth = getAuth(app);
const fs = getFirestore(app);
const DATA_DOC = doc(fs, 'bigsci', 'suitou');
// 10/23に読んだ号。ドキュメントがまだ無い時だけ、これで作る
const SEED = {"32-3":"2026-10-23","32-4":"2026-10-23","32-5":"2026-10-23","32-6":"2026-10-23","32-7":"2026-10-23","32-8":"2026-10-23","32-9":"2026-10-23","32-10":"2026-10-23","32-11":"2026-10-23","32-12":"2026-10-23"};


const TODAY=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
// 巻ごとの題（号の順＝4月号から3月号まで）。巻号n号は (n+3) 月号
const VOLS=[
 [29,1999,"姉が年中",["（題名わからず）","（題名わからず）","（題名わからず）","（題名わからず）","（題名わからず）","（題名わからず）","（題名わからず）","（題名わからず）","（題名わからず）","ももんがとぶ","こおりのかたち","ぼくたちライオンかぞく"]],
 [30,2000,"姉が年長・兄が年少",["あしあしあし","たけのこずんずん","しずく","ひまわりのはな","こんちゅうオリンピック","ねこねるのがすき","かきのきのいちねん","いえができるまで","なににみえる?","スペースシャトルしゅっぱつ!","ゆきふかふか","はるがきた"]],
 [31,2001,"兄が年中",["おおきなとりだちょう","いぬのきもち","しんぶんしであそぼう","しおだまりであそぼう","せみのぬけがら","すずめのくらし","りんごみのった","はやいぞしんかんせん","だいすきハムスター","のりができた","ふゆのたんぽぽ","つめつめつめ"]],
 [32,2002,"兄が年長・ムツキが年少",["ねことライオンにてる?にてない?","どこにいるのかな?","だいすきバナナ","あさがお さいた","どっちが・・・?","おおきいね カーフェリー","どんぐり ころころ","どうぶつのかお","ケーキやさん","ここは なんきょく","かげで あそぼう","うさぎが うまれた"]],
 [33,2003,"ムツキが年中",["はな","ちいさなつぼみ","みずであそぼう","むしのへんしん","すいかがみのった","チーターはしる","おいもほり","なんのうんてんせき?","きょうりゅうナンバーワン","とりのはね","チョコレートだいすき","ここがせかいいち"]],
 [34,2004,"ムツキが年長",["ぼくはざりがに","どうぶつのあかちゃん","へんしんペットボトル","かぶとむしのいちねん","たこといかにてる?にてない?","ゴーゴーはしごしゃ","ほしぞらウォッチング","いろがかわった","およぐとりペンギン","ゆきゆきゆき","やさいはいきている","にほんざるのあかちゃんおおきくなったよ!"]]
];
const STAR={"29-11":1,"30-11":1,"30-7":1}; // 雪の結晶・葉痕の候補
let marks={}; let busy={}; let ready=false;
const $=id=>document.getElementById(id);
function ym(fy,n){const m=n+3; return m<=12?fy+"."+m:(fy+1)+"."+(m-12);}
function render(){
  const L=$("list"); L.textContent="";
  let all=0, done=0;
  for(const [v,fy,who,titles] of VOLS){
    const rows=titles.map((t,i)=>t?[v+"-"+(i+1),ym(fy,i+1),t]:null).filter(Boolean);
    const sec=document.createElement("section"); sec.className="grp";
    const h=document.createElement("div"); h.className="gh";
    const n=rows.filter(r=>marks[r[0]]).length;
    h.textContent=v+"巻　"+fy+"年度（"+who+"）";
    const s=document.createElement("span"); s.textContent=n+" / "+rows.length; h.appendChild(s);
    sec.appendChild(h);
    for(const [id,date,title] of rows){
      all++; const m=marks[id]; if(m)done++;
      const on=m===TODAY, past=m&&!on;
      const b=document.createElement("button"); b.type="button";
      b.className="row"+(on?" on":"")+(past?" past":"");
      b.setAttribute("aria-pressed",m?"true":"false");
      const bx=document.createElement("span"); bx.className="box"; bx.textContent=on?"✓":(past?m.slice(5).replace("-","/"):"");
      const no=document.createElement("span"); no.className="no"; no.textContent=id+"　"+date;
      const ti=document.createElement("span"); ti.className="ti"; ti.textContent=title;
      if(STAR[id]){const st=document.createElement("span"); st.className="star"; st.textContent=" ★"; ti.appendChild(st);}
      b.append(bx,no,ti);
      b.addEventListener("click",()=>toggle(id));
      sec.appendChild(b);
    }
    L.appendChild(sec);
  }
  $("ct").textContent=done+" / "+all;
  $("pg").style.width=(all?done/all*100:0)+"%";
}

async function toggle(id){
  if(!ready){ $("st").textContent="まだ記録を読み込んでいるところです"; return; }
  if(busy[id]) return; busy[id]=1;
  const was=marks[id];
  try{
    if(was===TODAY){ delete marks[id]; render(); await updateDoc(DATA_DOC, {["marks."+id]: deleteField()}); }
    else{ marks[id]=TODAY; render(); await setDoc(DATA_DOC, {marks: {[id]: TODAY}}, {merge: true}); }
  }catch(e){
    if(was) marks[id]=was; else delete marks[id]; render();
    $("st").textContent="保存できませんでした："+(e&&e.code||e);
  }finally{ busy[id]=0; }
}
render();

getRedirectResult(auth).catch(()=>{});
const gate=document.createElement('div');
gate.style.cssText='position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--ink);text-align:center;padding:24px';
gate.innerHTML='<div style="font-size:15px;line-height:1.7;color:var(--sub)">ムツキ専用だよ<br>Googleでログインしてね</div><button type="button" style="padding:14px 28px;font-size:16px;border:0;border-radius:12px;background:#4285f4;color:#fff;font-weight:700">Googleでログイン</button><div style="font-size:13px;color:#d55;min-height:1.4em"></div>';
const gbtn=gate.querySelector('button'), gerr=gate.querySelector('div:last-child');
gbtn.addEventListener('click', async ()=>{
  gbtn.disabled=true; gerr.textContent='';
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ try{ await signInWithRedirect(auth, new GoogleAuthProvider()); } catch(e2){ gerr.textContent='ログインできなかった：'+(e2&&e2.code||e2); gbtn.disabled=false; } }
});
document.body.appendChild(gate);
let unsub=null;
onAuthStateChanged(auth, (user)=>{
  if(!user){ gate.style.display='flex'; return; }
  gate.remove();
  if(unsub) return;
  unsub=onSnapshot(DATA_DOC, async (snap)=>{
    if(!snap.exists()){ await setDoc(DATA_DOC, {marks: SEED}); return; }
    marks={...(snap.data().marks||{})}; ready=true; render();
    $("st").textContent="タップでチェック。★は強い見覚えあり（雪の結晶・葉痕の候補）。";
  }, (e)=>{ $("st").textContent="記録を読めませんでした："+(e&&e.code||e); });
});
</script>
</body>
</html>
